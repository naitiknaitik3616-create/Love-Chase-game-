<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MANAV × TWINKLE — LOVE CHASE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #000;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
    }

    .screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      pointer-events: auto;
      z-index: 1001;
    }

    .screen.active {
      display: flex;
    }

    #menuScreen {
      background: linear-gradient(135deg, #ff1493 0%, #ff69b4 50%, #ba55d3 100%);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 40px;
    }

    .logo {
      text-align: center;
      color: white;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .logo h1 {
      font-size: 4rem;
      margin-bottom: 10px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .logo p {
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: 2px;
    }

    .menu-buttons {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 15px 40px;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .btn-primary {
      background: white;
      color: #ff1493;
      flex: 1;
      min-width: 120px;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.2);
      color: white;
      border: 2px solid white;
      flex: 1;
      min-width: 120px;
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.3);
      transform: translateY(-3px);
    }

    #levelSelectScreen {
      background: linear-gradient(135deg, #ba55d3 0%, #9370db 100%);
      flex-direction: column;
      padding: 40px;
    }

    .level-select-header {
      color: white;
      margin-bottom: 30px;
      text-align: center;
    }

    .level-select-header h2 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
      gap: 10px;
      max-height: 60vh;
      overflow-y: auto;
      padding: 20px;
      background: rgba(0,0,0,0.2);
      border-radius: 20px;
    }

    .level-btn {
      aspect-ratio: 1;
      padding: 0;
      font-size: 0.9rem;
      background: rgba(255,255,255,0.1);
      color: white;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 10px;
      font-weight: 600;
    }

    .level-btn:hover {
      background: rgba(255,255,255,0.2);
    }

    .level-btn.locked {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .level-btn.completed {
      background: #00ff88;
      color: #000;
      border-color: #00ff88;
    }

    #dareScreen {
      background: linear-gradient(135deg, #ff1493 0%, #ff69b4 50%, #ba55d3 100%);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    .dare-container {
      background: white;
      border-radius: 30px;
      padding: 50px;
      max-width: 600px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }

    .dare-title {
      font-size: 2rem;
      color: #ff1493;
      margin-bottom: 30px;
      font-weight: 900;
    }

    .dare-label {
      font-size: 1.2rem;
      color: #333;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .dare-text {
      font-size: 1.3rem;
      color: #555;
      line-height: 1.8;
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(255, 20, 147, 0.1);
      border-radius: 15px;
      border-left: 5px solid #ff1493;
    }

    .dare-input-section {
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 15px;
      font-size: 1rem;
      border: 2px solid #ff1493;
      border-radius: 10px;
      font-family: inherit;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: #ba55d3;
      box-shadow: 0 0 10px rgba(255, 20, 147, 0.3);
    }

    .file-input-wrapper {
      margin: 20px 0;
    }

    .file-input-wrapper input[type="file"] {
      display: none;
    }

    .file-input-label {
      display: inline-block;
      padding: 12px 30px;
      background: #ff69b4;
      color: white;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      border: 2px solid #ff69b4;
    }

    .file-input-label:hover {
      background: #ff1493;
      border-color: #ff1493;
    }

    .file-preview {
      margin-top: 15px;
      padding: 10px;
      background: rgba(255, 20, 147, 0.1);
      border-radius: 10px;
      color: #555;
      font-size: 0.9rem;
    }

    .file-preview img, .file-preview video {
      max-width: 100%;
      max-height: 150px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .submit-dare-btn {
      width: 100%;
      padding: 18px;
      font-size: 1.1rem;
      background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
      color: white;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }

    .submit-dare-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(255, 20, 147, 0.4);
    }

    .submit-dare-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #gameHUD {
      padding: 20px;
      color: white;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      pointer-events: none;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .hud-stat {
      background: rgba(0,0,0,0.5);
      padding: 15px 25px;
      border-radius: 15px;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .distance-meter {
      width: 100%;
      height: 40px;
      background: rgba(0,0,0,0.7);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 2px solid #ff1493;
    }

    .distance-bar {
      height: 100%;
      background: linear-gradient(90deg, #ff1493 0%, #ff69b4 100%);
      width: 100%;
      transition: width 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      color: white;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .distance-label {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.8);
    }

    #levelCompleteScreen {
      background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
      padding: 40px;
    }

    .level-complete-card {
      background: white;
      border-radius: 30px;
      padding: 50px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .level-complete-card h2 {
      font-size: 2.5rem;
      color: #00cc6a;
      margin-bottom: 20px;
    }

    .level-stats {
      text-align: left;
      background: rgba(0,255,136,0.1);
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(0,255,136,0.3);
      color: #333;
    }

    .stat-row:last-child {
      border-bottom: none;
    }

    .stat-label {
      font-weight: 600;
    }

    .stat-value {
      color: #00cc6a;
      font-weight: 700;
    }

    .back-btn, .next-level-btn {
      pointer-events: auto;
    }

    @media (max-width: 768px) {
      .logo h1 {
        font-size: 2.5rem;
      }

      .logo p {
        font-size: 1.2rem;
      }

      .dare-container {
        padding: 30px;
        max-width: 100%;
      }

      .level-grid {
        grid-template-columns: repeat(auto-fit, minmax(50px, 1fr));
      }

      button {
        padding: 12px 25px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <div id="menuScreen" class="screen active">
      <div class="logo">
        <h1>MANAV × TWINKLE</h1>
        <p>LOVE CHASE</p>
      </div>
      <div class="menu-buttons">
        <button class="btn-primary" id="playBtn">PLAY</button>
        <button class="btn-secondary" id="levelsBtn">LEVELS</button>
        <button class="btn-secondary" id="settingsBtn">SETTINGS</button>
      </div>
    </div>

    <div id="levelSelectScreen" class="screen">
      <div class="level-select-header">
        <button class="btn-secondary" id="backFromLevelBtn" style="position: absolute; top: 20px; left: 20px;">← BACK</button>
        <h2>SELECT LEVEL</h2>
        <p id="levelInfo" style="font-size: 1.2rem; margin-top: 10px;">250 LEVELS TOTAL</p>
      </div>
      <div id="levelGrid" class="level-grid"></div>
    </div>

    <div id="dareScreen" class="screen">
      <div class="dare-container">
        <h2 class="dare-title">TWINKLE GOT CAUGHT! 😈</h2>
        <p class="dare-label">YOUR DARE</p>
        <div class="dare-text" id="dareText"></div>
        
        <div class="dare-input-section">
          <label for="dareAnswer" class="dare-label">YOUR ANSWER</label>
          <textarea id="dareAnswer" placeholder="Type your response here..."></textarea>
        </div>

        <div class="file-input-wrapper">
          <label for="dareFile" class="file-input-label">+ ATTACH FILE</label>
          <input type="file" id="dareFile" accept="image/*,video/*,audio/*">
          <div id="filePreview" class="file-preview" style="display: none;"></div>
        </div>

        <button class="submit-dare-btn" id="submitDareBtn">SUBMIT DARE ❤️</button>
      </div>
    </div>

    <div id="levelCompleteScreen" class="screen">
      <div class="level-complete-card">
        <h2>LEVEL COMPLETE ❤️</h2>
        <div class="level-stats">
          <div class="stat-row">
            <span class="stat-label">LEVEL</span>
            <span class="stat-value" id="completedLevel">1</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">TIME</span>
            <span class="stat-value" id="completedTime">0s</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">SCORE</span>
            <span class="stat-value" id="completedScore">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">BEST SCORE</span>
            <span class="stat-value" id="completedBestScore">0</span>
          </div>
        </div>
        <button class="btn-primary next-level-btn" id="nextLevelBtn">NEXT LEVEL</button>
      </div>
    </div>

    <div id="gameHUD">
      <div class="hud-top">
        <div class="hud-stat">LEVEL: <span id="hudLevel">1</span></div>
        <div class="hud-stat">SCORE: <span id="hudScore">0</span></div>
        <div class="hud-stat">SPEED: <span id="hudSpeed">1.0x</span></div>
      </div>
      <div class="distance-meter">
        <div class="distance-bar" id="distanceBar" style="width: 100%;">
          <span>TWINKLE</span>
          <span>MANAV</span>
        </div>
      </div>
      <div class="distance-label">
        <span>DISTANCE: <span id="distanceValue">100m</span></span>
        <span id="catchWarning" style="color: #ff1493; display: none; font-weight: 900;">⚠️ GETTING CLOSER ⚠️</span>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
