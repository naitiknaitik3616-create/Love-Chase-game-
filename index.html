<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANAV × TWINKLE — LOVE CHASE 🎮❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff1493 0%, #ba55d3 50%, #1e90ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        #app {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 50px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 3.5em;
            margin-bottom: 15px;
            text-shadow: 0 0 30px rgba(255, 20, 147, 0.8);
            letter-spacing: 2px;
            font-weight: 900;
        }

        .subtitle {
            font-size: 1.8em;
            margin-bottom: 40px;
            opacity: 0.95;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .controls {
            margin: 35px 0;
            font-size: 1.2em;
            line-height: 2;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            border-left: 4px solid #ff1493;
        }

        .controls p {
            margin: 10px 0;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        button {
            padding: 16px 35px;
            font-size: 1.1em;
            border: 2px solid white;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
        }

        button:active {
            transform: scale(0.95);
        }

        .loading {
            font-size: 1.3em;
            margin-top: 35px;
            animation: pulse 1.5s infinite;
            font-weight: 600;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .footer {
            margin-top: 35px;
            font-size: 1em;
            opacity: 0.85;
            font-weight: 500;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #gameCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        .dare-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff1493 0%, #ba55d3 100%);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .dare-screen.active {
            display: flex;
        }

        .dare-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .dare-box h2 {
            color: #ff1493;
            font-size: 2em;
            margin-bottom: 20px;
        }

        .dare-box p {
            color: #333;
            font-size: 1.2em;
            line-height: 1.6;
            margin: 20px 0;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ff1493;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            background: rgba(255, 20, 147, 0.05);
            color: #333;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #ba55d3;
            box-shadow: 0 0 10px rgba(255, 20, 147, 0.3);
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        .dare-buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .dare-buttons button {
            flex: 1;
            background: #ff1493;
            color: white;
            border: none;
            padding: 12px;
        }

        .dare-buttons button:hover {
            background: #ff69b4;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5em;
            }

            .subtitle {
                font-size: 1.3em;
            }

            .game-container {
                padding: 30px;
            }

            button {
                padding: 12px 25px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="game-container">
            <h1>🎮 MANAV × TWINKLE 💕</h1>
            <p class="subtitle">LOVE CHASE — 250 Levels!</p>
            
            <div class="controls">
                <p><strong>⬅️ ➡️</strong> Move | <strong>⬆️</strong> Jump | <strong>⬇️</strong> Slide</p>
                <p>📱 Mobile: Swipe to move</p>
            </div>

            <div class="button-group">
                <button onclick="startGame()">▶️ PLAY GAME</button>
                <button onclick="openRepo()">📂 VIEW CODE</button>
            </div>

            <div class="loading">🔄 Click PLAY to start the adventure...</div>
            <p class="footer">Made with ❤️ for Twinkle & Manav</p>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="dareScreen" class="dare-screen">
        <div class="dare-box">
            <h2>🎯 DARE UNLOCKED! 🎯</h2>
            <p id="dareText" style="color: #666; font-size: 1.3em; background: rgba(255,20,147,0.1); padding: 15px; border-radius: 10px; border-left: 4px solid #ff1493;"></p>
            <input type="text" id="dareAnswer" placeholder="Your answer...">
            <div class="dare-buttons">
                <button onclick="completeDare()">✅ SUBMIT</button>
                <button onclick="closeGame()" style="background: #999;">← BACK</button>
            </div>
        </div>
    </div>

    <script type="module">
        // Using Three.js from CDN
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@r128/build/three.module.js';

        let scene, camera, renderer;
        let gameRunning = false;
        let gameStarted = false;

        const DARES = [
            "Tell me 3 things you love about me 💕",
            "Send me a selfie with a silly face 😜",
            "Write me a love poem in 2 minutes ✍️",
            "Sing a song dedicated to me 🎵",
            "Do 10 pushups! 💪",
            "Tell me your favorite memory with me 📸",
            "Draw a picture for me 🎨",
            "List 5 reasons you like me ❤️",
            "Send a voice message 🎤",
            "Do a funny dance! 💃"
        ];

        window.startGame = function() {
            if (gameStarted) return;
            gameStarted = true;
            gameRunning = true;

            const app = document.getElementById('app');
            app.style.display = 'none';

            const canvas = document.getElementById('gameCanvas');
            canvas.style.display = 'block';

            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.Fog(0x1a1a2e, 150, 400);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 12);

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            // Lights
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(30, 30, 30);
            light.castShadow = true;
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));

            // Ground
            const groundGeo = new THREE.PlaneGeometry(20, 500);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x4a4a6a });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Player
            const playerGeo = new THREE.BoxGeometry(1, 2, 1);
            const playerMat = new THREE.MeshStandardMaterial({ color: 0xff1493 });
            const player = new THREE.Mesh(playerGeo, playerMat);
            player.position.y = 1;
            player.castShadow = true;
            scene.add(player);

            // Chaser
            const chaserGeo = new THREE.BoxGeometry(1, 2, 1);
            const chaserMat = new THREE.MeshStandardMaterial({ color: 0x1e90ff });
            const chaser = new THREE.Mesh(chaserGeo, chaserMat);
            chaser.position.set(0, 1, -50);
            chaser.castShadow = true;
            scene.add(chaser);

            // Game state
            let playerX = 0, playerZ = 0, chaserZ = -50;
            let speed = 0.3, level = 1, score = 0;
            const keys = {};

            window.addEventListener('keydown', (e) => keys[e.key] = true);
            window.addEventListener('keyup', (e) => keys[e.key] = false);

            // Game loop
            const animate = () => {
                if (!gameRunning) return;
                requestAnimationFrame(animate);

                if (keys['ArrowLeft'] || keys['a']) playerX = Math.max(-8, playerX - 0.3);
                if (keys['ArrowRight'] || keys['d']) playerX = Math.min(8, playerX + 0.3);
                if (keys['ArrowUp'] || keys['w'] || keys[' ']) player.position.y = Math.max(1, player.position.y - 0.3);

                player.position.x = playerX;
                player.position.z = playerZ;

                chaserZ += speed * 0.5;
                chaser.position.z = chaserZ;

                const distance = Math.abs(player.position.z - chaser.position.z);

                if (distance > 1) speed += 0.0001;
                playerZ += speed;
                score += speed;

                camera.position.x = playerX * 0.3;
                camera.position.z = playerZ + 12;
                camera.lookAt(playerX, 2, playerZ);

                if (distance < 3) {
                    gameRunning = false;
                    showDare();
                    return;
                }

                renderer.render(scene, camera);
            };

            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        };

        function showDare() {
            const dare = DARES[Math.floor(Math.random() * DARES.length)];
            document.getElementById('dareText').textContent = dare;
            document.getElementById('dareScreen').classList.add('active');
            document.getElementById('dareAnswer').value = '';
            document.getElementById('dareAnswer').focus();
        }

        window.completeDare = function() {
            const answer = document.getElementById('dareAnswer').value;
            if (!answer.trim()) {
                alert('Please write something! 💕');
                return;
            }
            alert('❤️ Dare submitted! You rock! 🎉\n\nNext level unlocked!');
            location.reload();
        };

        window.closeGame = function() {
            gameRunning = false;
            document.getElementById('dareScreen').classList.remove('active');
            location.reload();
        };

        window.openRepo = () => window.open('https://github.com/naitiknaitik3616-create/Love-Chase-game-', '_blank');
    </script>
</body>
</html>
